# Optional TLS front end for a Debian/Ubuntu VPS.
#
# Use this when UnionKitBot is exposed to the public internet. Place the certificate and key
# produced by certbot in ./docker/certs (mounted read-only by docker-compose.override.tls.yml)
# and never commit them to source control.
#
#   1. Point a DNS A/AAAA record at the VPS.
#   2. apt install certbot && certbot certonly --standalone -d bot.example.com
#   3. cp /etc/letsencrypt/live/bot.example.com/fullchain.pem docker/certs/
#      cp /etc/letsencrypt/live/bot.example.com/privkey.pem  docker/certs/
#   4. docker compose -f docker-compose.yml -f docker-compose.override.tls.yml up -d
#   5. Reload after each renewal: docker compose exec ui nginx -s reload

# See docker/nginx.conf for why resolution happens at request time instead of via `upstream`.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    set $api_upstream "api:8080";
    server_name bot.example.com;

    # Keep the ACME challenge path available so certbot can renew over http-01.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    set $api_upstream "api:8080";
    server_name bot.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ws {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
